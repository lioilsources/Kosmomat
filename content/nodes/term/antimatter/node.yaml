id: term.antimatter
type: term
literature: mainstream
title: { cs: "Antihmota", en: "Antimatter" }
summary:
  cs: "Hmota z antičástic: stejná hmotnost, opačný náboj. Není to hypotéza — pozitrony objevil Anderson 1933, antivodík se v CERN chytá a měří. Nezaměňovat s temnou hmotou ani temnou energií."
  en: "Matter made of antiparticles: same mass, opposite charge. Not a hypothesis — Anderson discovered positrons in 1933 and antihydrogen is trapped and measured at CERN. Not to be confused with dark matter or dark energy."
