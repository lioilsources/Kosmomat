id: term.dark-matter
type: term
literature: mainstream
title: { cs: "Temná hmota", en: "Dark matter" }
summary:
  cs: "Hypotetická hmota, která nevyzařuje světlo a projevuje se jen gravitačně. Odvozená z pohybů galaxií, gravitačních čoček a reliktního záření; částice temné hmoty zatím nikdo přímo nezachytil."
  en: "Hypothetical matter that emits no light and shows itself only through gravity. Inferred from galaxy motions, gravitational lensing and the cosmic microwave background; no dark matter particle has yet been detected directly."
