title: { cs: "Mars", en: "Mars" }
summary:
  cs: "Čtvrtá planeta od Slunce, poloviční velikosti Země, s řídkou atmosférou z oxidu uhličitého. Od Země je 55 až 400 milionů km, světlo letí 3 až 22 minut. Otevřená otázka: odkud se bere (a jestli vůbec) metan."
  en: "The fourth planet from the Sun, half Earth's size, with a thin carbon dioxide atmosphere. It is 55 to 400 million km from Earth; light takes 3 to 22 minutes. Open question: where methane comes from — and whether it is there at all."
