literature: mainstream
title: { cs: "Neptun a Vulkán", en: "Neptune and Vulcan" }
summary:
  cs: "Le Verrier z odchylek Uranu předpověděl neviditelnou planetu — Neptun se našel v roce 1846. Z odchylek Merkuru předpověděl Vulkán — ten neexistuje a vyřešila to nová teorie gravitace (1915). Obě cesty jednou vyhrály."
  en: "From Uranus's deviations Le Verrier predicted an unseen planet — Neptune was found in 1846. From Mercury's deviations he predicted Vulcan — it does not exist, and a new theory of gravity solved it (1915). Both routes have won once."
