id: constellation.aries
type: constellation
astromat: true
title: { cs: "Beran", en: "Aries" }
summary:
  cs: "Malé souhvězdí na ekliptice mezi Rybami a Býkem. Nejjasnější hvězda Hamal je asi 66 světelných let daleko. Znamení Berana začíná jarní rovnodenností; Slunce do souhvězdí kvůli precesi vchází zhruba o měsíc později."
  en: "A small constellation on the ecliptic between Pisces and Taurus. Its brightest star, Hamal, is about 66 light years away. The sign of Aries begins at the spring equinox; because of precession the Sun enters the constellation about a month later."
