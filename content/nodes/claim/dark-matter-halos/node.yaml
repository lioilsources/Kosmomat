id: claim.dark-matter-halos
type: claim
status: strong
literature: mainstream
title: { cs: "Galaxie obklopují hala temné hmoty", en: "Galaxies are embedded in dark matter halos" }
summary:
  cs: "Výklad plochých rotačních křivek: kolem galaxií je rozsáhlé halo hmoty, která nesvítí ani nepohlcuje světlo a projevuje se jen gravitací. Podporují ho i čočkování a reliktní záření; částice zatím nenalezena."
  en: "An interpretation of flat rotation curves: galaxies sit inside extended halos of matter that neither emits nor absorbs light and shows itself only through gravity. Lensing and the CMB also support it; no particle has been found yet."
