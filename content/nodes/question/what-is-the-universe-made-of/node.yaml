id: q.what-is-the-universe-made-of
type: question
testability: empirical
title: { cs: "Z čeho je vesmír?", en: "What is the universe made of?" }
summary:
  cs: "Od vody a čtyř živlů přes Slunce z vodíku až po dnešní rozpočet: asi 5 % běžné hmoty, 26 % temné hmoty a 69 % temné energie. Ty dvě poslední složky jsou odvozené z pozorování, ne přímo zachycené."
  en: "From water and the four elements, via a Sun made of hydrogen, to today's budget: about 5% ordinary matter, 26% dark matter and 69% dark energy. The last two are inferred from observations, not caught directly."
