id: obs.solar-neutrino-spectrum
type: observation
status: established
literature: mainstream
title: { cs: "Spektrum slunečních neutrin", en: "Solar neutrino spectrum" }
summary:
  cs: "Detektory pod zemí měří neutrina ze Slunce od roku 1968. Borexino v letech 2014–2020 rozlišil složky z řetězce pp i z cyklu CNO; jejich toky odpovídají jaderné fúzi v jádru Slunce."
  en: "Underground detectors have measured neutrinos from the Sun since 1968. In 2014–2020 Borexino resolved the components from the pp chain and the CNO cycle; their fluxes match nuclear fusion in the Sun's core."
