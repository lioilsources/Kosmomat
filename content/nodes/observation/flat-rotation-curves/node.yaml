title: { cs: "Ploché rotační křivky galaxií", en: "Flat galaxy rotation curves" }
summary:
  cs: "Hvězdy a plyn ve vnějších částech spirálních galaxií obíhají skoro stejně rychle jako blíž ke středu, i když tam je viditelné hmoty už málo. Měřeno opakovaně od 70. let různými metodami."
  en: "Stars and gas in the outer parts of spiral galaxies orbit almost as fast as those closer in, even where little visible matter remains. Measured repeatedly since the 1970s with different methods."
